events {
   worker_connections  1024;
}

http {
   include       mime.types;
   default_type  application/octet-stream;
   sendfile        on;
   keepalive_timeout  65;

   client_max_body_size     50m;
   client_body_buffer_size  10m;
   client_header_timeout    1m;
   client_body_timeout      1m;

   gzip on;
   gzip_min_length  1k;
   gzip_buffers     4 16k;
   gzip_comp_level  4;
   gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
   gzip_vary on;

    server {
        listen 80;
        server_name  121.89.94.157;

        ## ssl on;
        ## ssl_certificate ssl证书文件位置;
        ## ssl_certificate_key ssl证书文件位置;
        ## ssl_session_timeout 5m;
        ## ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
        ## ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ## ssl_prefer_server_ciphers on;

        location / {
           root   /usr/local/aurora-vue/blog;
           index  index.html index.htm;
           try_files $uri $uri/ /index.html;
        }

        location ^~ /api/ {
           proxy_pass http://172.20.55.205:9080/;
           proxy_set_header   Host             $host;
           proxy_set_header   X-Real-IP        $remote_addr;
           proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        }

   }

    server {
        listen 9010;
        server_name  121.89.94.157;

        ## ssl on;
        ## ssl_certificate ssl证书文件位置;
        ## ssl_certificate_key ssl文件位置;
        ## ssl_session_timeout 5m;
        ## ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
        ## ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ## ssl_prefer_server_ciphers on;

        location / {
           root   /usr/local/aurora-vue/admin;
           index  index.html index.htm;
           try_files $uri $uri/ /index.html;
        }

        location ^~ /api/ {
           proxy_pass http://121.89.94.157:9080/;
           proxy_set_header   Host             $host;
           proxy_set_header   X-Real-IP        $remote_addr;
           proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        }

   }
}